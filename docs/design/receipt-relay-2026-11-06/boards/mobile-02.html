<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 02</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 02</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 手机 390×844 @2x / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/mobile/reports.png" alt="花在了哪里" />
      <figcaption><b>花在了哪里</b><span>reports</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/report-range.png" alt="选一段时间" />
      <figcaption><b>选一段时间</b><span>report-range</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/net-worth.png" alt="资产慢慢积累" />
      <figcaption><b>资产慢慢积累</b><span>net-worth</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/extended-reports.png" alt="回款与分摊" />
      <figcaption><b>回款与分摊</b><span>extended-reports</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/bank-detail.png" alt="工资卡" />
      <figcaption><b>工资卡</b><span>bank-detail</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/liability-detail.png" alt="信用卡" />
      <figcaption><b>信用卡</b><span>liability-detail</span></figcaption>
    </figure>
  </div>
</html>
