<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 13</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 13</h1>

  <div class="grid">
    <figure>
      <img src="../screens/mobile/record.png" alt="账单详情" />
      <figcaption><b>账单详情</b><span>record</span></figcaption>
    </figure>
    <figure>

    <figure>

    </figure>
    <figure>
      <img src="../screens/mobile/related-entry.png" alt="关联原消费" />

    <figure>
      <img src="../screens/mobile/filters.png" alt="只看关心的账单" />
      <figcaption><b>只看关心的账单</b><span>filters</span></figcaption>
    </figure>
  </div>
</html>
