<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>桌面视觉稿 / 25</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>桌面视觉稿 / 25</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 桌面 1440×1024 / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/desktop/theme.png" alt="给账页换个外观" />
      <figcaption><b>给账页换个外观</b><span>theme</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/privacy.png" alt="账本的边界，你清楚" />
      <figcaption><b>账本的边界，你清楚</b><span>privacy</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/trash.png" alt="删掉的，也留个退路" />
      <figcaption><b>删掉的，也留个退路</b><span>trash</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/deleted-record.png" alt="这笔已移入回收站" />
      <figcaption>
        <b>这笔已移入回收站</b><span>deleted-record</span>
      </figcaption>
    </figure>
  </div>
</html>
