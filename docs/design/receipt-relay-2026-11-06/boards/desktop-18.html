<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>桌面视觉稿 / 18</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>桌面视觉稿 / 18</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 桌面 1440×1024 / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/desktop/overview.png" alt="这个月，花得清楚" />
      <figcaption><b>这个月，花得清楚</b><span>overview</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/transactions.png" alt="每一笔，都有来处" />
      <figcaption><b>每一笔，都有来处</b><span>transactions</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/record.png" alt="账单详情" />
      <figcaption><b>账单详情</b><span>record</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/entry.png" alt="记下这一笔" />
      <figcaption><b>记下这一笔</b><span>entry</span></figcaption>
    </figure>
  </div>
</html>
