<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>桌面视觉稿 / 06</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>桌面视觉稿 / 06</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 桌面 1440×1024 / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img
        src="../screens/desktop/missing-baseline.png"
        alt="这部分，还不能算完整"
      />
      <figcaption>
        <b>这部分，还不能算完整</b><span>missing-baseline</span>
      </figcaption>
    </figure>
    <figure>
      <img
        src="../screens/desktop/foreign-account.png"
        alt="外币账户也有依据"
      />
      <figcaption>
        <b>外币账户也有依据</b><span>foreign-account</span>
      </figcaption>
    </figure>
    <figure>
      <img
        src="../screens/desktop/investment-account.png"
        alt="投资账户，记录你核对的值"
      />
      <figcaption>
        <b>投资账户，记录你核对的值</b><span>investment-account</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/welcome.png" alt="把每一笔，存进小日子" />
      <figcaption><b>把每一笔，存进小日子</b><span>welcome</span></figcaption>
    </figure>
  </div>
</html>
