<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 03</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 03</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 手机 390×844 @2x / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img
        src="../screens/mobile/liability-edit.png"
        alt="把这张信用卡记清楚"
      />
      <figcaption>
        <b>把这张信用卡记清楚</b><span>liability-edit</span>
      </figcaption>
    </figure>
    <figure>
      <img
        src="../screens/mobile/card-repayment.png"
        alt="记下一次信用卡还款"
      />
      <figcaption>
        <b>记下一次信用卡还款</b><span>card-repayment</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/card-repayment-done.png" alt="还款已经记好" />
      <figcaption>
        <b>还款已经记好</b><span>card-repayment-done</span>
      </figcaption>
    </figure>
    <figure>
      <img
        src="../screens/mobile/calibration-difference.png"
        alt="差的20元，先说明白"
      />
      <figcaption>
        <b>差的20元，先说明白</b><span>calibration-difference</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/calibration-done.png" alt="新基准已经保留" />
      <figcaption>
        <b>新基准已经保留</b><span>calibration-done</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/account-records.png" alt="账户里的原始账单" />
      <figcaption>
        <b>账户里的原始账单</b><span>account-records</span>
      </figcaption>
    </figure>
  </div>
</html>
