<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>桌面视觉稿 / 27</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>桌面视觉稿 / 27</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 桌面 1440×1024 / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/desktop/loading.png" alt="正在打开这本账" />
      <figcaption><b>正在打开这本账</b><span>loading</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/error.png" alt="此页暂时算不出来" />
      <figcaption><b>此页暂时算不出来</b><span>error</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/delete-confirm.png" alt="移入回收站？" />
      <figcaption><b>移入回收站？</b><span>delete-confirm</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/confirmed.png" alt="这一笔，已经记好" />
      <figcaption><b>这一笔，已经记好</b><span>confirmed</span></figcaption>
    </figure>
  </div>
</html>
