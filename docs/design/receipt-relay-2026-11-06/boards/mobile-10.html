<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 10</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 10</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 手机 390×844 @2x / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/mobile/goal-contribute.png" alt="离目标，再近一点" />
      <figcaption>
        <b>离目标，再近一点</b><span>goal-contribute</span>
      </figcaption>
    </figure>
    <figure>
      <img
        src="../screens/mobile/connection-success.png"
        alt="连接状态已确认"
      />
      <figcaption>
        <b>连接状态已确认</b><span>connection-success</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/notifications-read.png" alt="提醒都看过了" />
      <figcaption>
        <b>提醒都看过了</b><span>notifications-read</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/session-revoked.png" alt="这台设备已退出" />
      <figcaption><b>这台设备已退出</b><span>session-revoked</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/restore-record-done.png" alt="账单已经恢复" />
      <figcaption>
        <b>账单已经恢复</b><span>restore-record-done</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/cleanup-done.png" alt="未使用附件已清理" />
      <figcaption><b>未使用附件已清理</b><span>cleanup-done</span></figcaption>
    </figure>
  </div>
</html>
