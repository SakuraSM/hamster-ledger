<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 05</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 05</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 手机 390×844 @2x / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img src="../screens/mobile/login.png" alt="接着记下生活" />
      <figcaption><b>接着记下生活</b><span>login</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/register.png" alt="为自己的账，留个位置" />
      <figcaption><b>为自己的账，留个位置</b><span>register</span></figcaption>
    </figure>
    <figure>
      <img
        src="../screens/mobile/registration-closed.png"
        alt="这项服务暂未开放注册"
      />
      <figcaption>
        <b>这项服务暂未开放注册</b><span>registration-closed</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/connect.png" alt="连接你的服务" />
      <figcaption><b>连接你的服务</b><span>connect</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/password.png" alt="给账号换个新密码" />
      <figcaption><b>给账号换个新密码</b><span>password</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/sessions.png" alt="账号与设备" />
      <figcaption><b>账号与设备</b><span>sessions</span></figcaption>
    </figure>
  </div>
</html>
