<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>桌面视觉稿 / 26</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(2, 720px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>桌面视觉稿 / 26</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 桌面 1440×1024 / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img
        src="../screens/desktop/attachment-cleanup.png"
        alt="清理前，先看范围"
      />
      <figcaption>
        <b>清理前，先看范围</b><span>attachment-cleanup</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/empty.png" alt="账页还空着" />
      <figcaption><b>账页还空着</b><span>empty</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/offline.png" alt="暂时离线，账还在" />
      <figcaption><b>暂时离线，账还在</b><span>offline</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/desktop/readonly.png" alt="离线时，先看看" />
      <figcaption><b>离线时，先看看</b><span>readonly</span></figcaption>
    </figure>
  </div>
</html>
