<!doctype html>
<html lang="zh-CN">
  <meta charset="utf-8" /><title>手机视觉稿 / 09</title
  ><style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 28px 30px 30px;
      background: #eae8df;
      color: #2a3022;
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    h1 {
      font-size: 22px;
      letter-spacing: -0.5px;
      margin: 0 0 7px;
    }
    p {
      font-size: 11px;
      color: #5e6c49;
      margin: 0 0 23px;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(3, 390px);
      gap: 20px;
    }
    figure {
      margin: 0;
      min-width: 0;
    }
    img {
      display: block;
      width: 100%;
      height: auto;
      box-shadow: 0 4px 20px #26341210;
    }
    figcaption {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: center;
      padding: 10px 2px 13px;
      font-size: 11px;
      line-height: 1.5;
    }
    figcaption span {
      font-size: 9px;
      color: #63734b;
    }
    figcaption b {
      font-weight: 550;
    }
  </style>
  <h1>手机视觉稿 / 09</h1>
  <p>仓鼠记账 / 凭证接力 / 2026-11-06 / 手机 390×844 @2x / 全部虚构样例</p>
  <div class="grid">
    <figure>
      <img
        src="../screens/mobile/payment-permission.png"
        alt="还差一次系统授权"
      />
      <figcaption>
        <b>还差一次系统授权</b><span>payment-permission</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/entry-income.png" alt="一笔收入，清楚记下" />
      <figcaption>
        <b>一笔收入，清楚记下</b><span>entry-income</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/entry-transfer.png" alt="钱换个位置" />
      <figcaption><b>钱换个位置</b><span>entry-transfer</span></figcaption>
    </figure>
    <figure>
      <img
        src="../screens/mobile/reimburse-entry.png"
        alt="回款，关联到原消费"
      />
      <figcaption>
        <b>回款，关联到原消费</b><span>reimburse-entry</span>
      </figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/loan-edit.png" alt="借给谁，什么时候还" />
      <figcaption><b>借给谁，什么时候还</b><span>loan-edit</span></figcaption>
    </figure>
    <figure>
      <img src="../screens/mobile/goal-edit.png" alt="想存下的那件事" />
      <figcaption><b>想存下的那件事</b><span>goal-edit</span></figcaption>
    </figure>
  </div>
</html>
